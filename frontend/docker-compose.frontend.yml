# The `frontend` service for backend/docker-compose.yml. Paste the block under
# `services:` there. Paths are relative to backend/.
services:
  frontend:
    build:
      context: ../frontend
      args:
        VITE_JAEGER_URL: ${VITE_JAEGER_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
