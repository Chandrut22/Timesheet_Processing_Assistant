# nginx for the Timesheet Assistant frontend.
# Serves dist/ and forwards the API paths exactly like the Vite dev proxy
# (vite.config.ts), so the browser only ever talks to this one origin.
# Runs as the unprivileged "nginx" user, so it listens on 8080 and keeps its
# pid and temp files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Docker's DNS. Upstream names are looked up again every 10 s, so a
    # restarted auth-service / core-service (new container IP) keeps working
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limits per client IP: a coarse outer layer in front of the services' own
    # per-user / per-endpoint limits (RATE_LIMIT_* in their .env). Sign-in and password
    # endpoints get a tight budget; everything else a generous one that a person
    # clicking around never reaches. Over the limit: 429 with the same JSON shape the
    # API uses (see @rate_limited below), so the frontend shows the same message.
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=20r/s;
    limit_req_status 429;

    # Content Security Policy: only this origin's own scripts, styles, images and API.
    # 'unsafe-inline' for styles only: the UI kit sets style="" attributes (positions
    # of menus and dialogs); no inline <script> is ever allowed. A map (not "set") so
    # the value is there in every location, the named @rate_limited one included.
    map $host $csp {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        set $auth_upstream http://auth-service:8001;
        set $core_upstream http://core-service:8002;

        # Security headers. nginx only inherits add_header into locations that
        # set none of their own, so EVERY location with its own add_header below
        # repeats all of them (keep the lists in sync).
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        # HSTS: only once the site is served over HTTPS (TLS here or at a load
        # balancer in front). Then uncomment it here AND in the locations below.
        # Never on plain http: browsers ignore it there, and a mistake pins the
        # host to https for a year.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # nginx's own 429 (limit_req) in the API's shape. A 429 from the services
        # themselves passes through untouched (proxy_intercept_errors is off).
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header X-Frame-Options DENY always;
            return 429 '{"detail":"Too many requests. Try again in 10 seconds.","code":"rate_limited"}';
        }

        # Shared proxy settings. Set-Cookie passes through untouched.
        # X-Forwarded-For is REPLACED with the address that connected to nginx, never
        # appended to: whatever a client writes in that header is dropped here, so the
        # services (TRUSTED_PROXY_HOPS=1) rate-limit the real client, not a forged IP.
        # If a load balancer sits in front of nginx, let nginx learn the client from it
        # with the realip module (set_real_ip_from <LB range>; real_ip_header
        # X-Forwarded-For;) so $remote_addr is the client again.
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # auth-service. The path is kept (the refresh cookie has Path=/auth).
        # With a variable and no URI part, proxy_pass forwards the request URI
        # unchanged: /auth/login -> auth-service:8001/auth/login.
        location /auth/ {
            limit_req zone=auth_ip burst=20 nodelay;
            proxy_pass $auth_upstream;
        }
        # GET /users?role=… has no trailing slash, so it needs its own match.
        # Otherwise it would fall through to index.html.
        location = /users {
            limit_req zone=api_ip burst=100 nodelay;
            proxy_pass $auth_upstream;
        }
        location /users/ {
            limit_req zone=api_ip burst=100 nodelay;
            client_max_body_size 6m;        # users import: MAX_IMPORT_MB=5, plus overhead
            proxy_pass $auth_upstream;
        }

        # core-service. /api is removed: /api/me -> core-service:8002/me
        # (the query string is kept).
        location /api/ {
            limit_req zone=api_ip burst=100 nodelay;
            client_max_body_size 160m;      # uploads: 10 files x 15 MB, plus overhead
            proxy_request_buffering off;    # stream uploads straight through
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Hashed build files never change, so they can be cached for a year.
        # A missing file is a 404, never index.html.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header X-Frame-Options DENY always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header X-Frame-Options DENY always;
        }

        # SPA fallback: /timesheets/<id> and the other app routes load index.html
        # (via the location above, so they get no-cache too).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
