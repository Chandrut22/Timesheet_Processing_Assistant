[project]
name = "auth-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chandru", email = "chandrutd22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.143.0",
    "httpx2>=2.15.1",
    "openpyxl>=3.1.5",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.13"
files = ["src", "scripts"]
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["src/data/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so the tests can import src.* (pytest does not add it by itself)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
