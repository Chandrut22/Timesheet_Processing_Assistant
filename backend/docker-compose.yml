# Timesheet Processing Assistant: local / dev stack.
#
#   One Postgres (database timesheet_db) and one Redis (db 0), shared by all services:
#     Postgres: each service owns a schema   -> auth.*, core.*
#     Redis:    each service prefixes keys   -> auth:*, core:*
#
#   Each API container runs its own migrations (alembic upgrade head) before it starts.
#   The core worker waits until core-service is healthy, i.e. migrations are done.
#
#   cd backend
#   docker compose up -d --build
#
# Needs backend/.env with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB and
# REDIS_PASSWORD, auth-service/.env and core-service/.env, and auth-service/keys/.
#
# This base file publishes only the frontend (port 80). The APIs,
# Postgres and Redis are reachable only inside Docker. docker-compose.override.yml
# (loaded automatically by "docker compose up") adds their host ports for local
# development. On a server, skip it: docker compose -f docker-compose.yml up -d

name: timesheet

x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}@postgres:5432/${POSTGRES_DB:-timesheet_db}

# Inside Docker, services reach each other by name (postgres, redis), not 127.0.0.1.
# These override the 127.0.0.1 values in each service's .env (those are for local runs).
# Logs: every service writes OpenTelemetry log records to stdout as normal text lines
# (`docker compose logs core-worker`); OTEL_LOGS_FORMAT=json in backend/.env gives one
# JSON object per line instead, for a log shipper. OTEL_ENABLED adds trace ids, so all the lines
# of one email or upload share an id (also saved on each step-log row). To send logs and
# traces to an OpenTelemetry Collector (or Grafana, SigNoz, ...), set
# OTEL_EXPORTER_OTLP_ENDPOINT in backend/.env, e.g. http://otel-collector:4318.
x-otel-env: &otel-env
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_LOGS_FORMAT: ${OTEL_LOGS_FORMAT:-text}

# Redis requires a password (REDIS_PASSWORD in backend/.env; letters and digits only,
# because it sits inside the URL).
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}@redis:6379/0

x-auth-env: &auth-env
  <<: *otel-env
  DATABASE_URL: *db-url
  REDIS_URL: *redis-url
  JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
  OTEL_SERVICE_NAME: auth-service

x-core-env: &core-env
  <<: *otel-env
  DATABASE_URL: *db-url
  REDIS_URL: *redis-url
  JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
  UPLOAD_DIR: /data/uploads  # the shared "uploads" volume (files waiting for the worker)

services:
  # --- shared infrastructure ------------------------------------------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-timesheet_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis only holds the job queue, sessions, codes and counters (no files), so a small
    # memory cap is plenty. noeviction: when full, writes fail loudly instead of Redis
    # silently dropping queued jobs or sign-in sessions.
    # --requirepass: every client must send REDIS_PASSWORD (the services get it in REDIS_URL).
    command:
      [
        "redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
        "--maxmemory-policy", "noeviction",
        "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # lets the healthcheck's redis-cli sign in
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

    # --- public entry point: nginx (serves the built React app, proxies the APIs) ----

  nginx:
    build:
      context: ..                              # repo root: the image also builds ../frontend
      dockerfile: backend/nginx/Dockerfile
    image: timesheet-nginx:latest
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # --- auth-service ---------------------------------------------------------

  auth-service:
    build: ./auth-service
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8001"]
    env_file: ./auth-service/.env
    environment: *auth-env
    volumes:
      - ./auth-service/keys:/app/keys:ro  # private + public key (only auth signs tokens)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s  # time for the migration before health checks count
    restart: unless-stopped

  # --- core-service ---------------------------------------------------------

  core-service:
    build: ./core-service
    image: timesheet-core:latest
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8002"]
    env_file: ./core-service/.env
    environment: *core-env
    volumes:
      # ONLY the public key: core verifies tokens, it can never create them
      - ./auth-service/keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
      - uploads:/data/uploads  # uploaded files wait here for the worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  core-worker:
    image: timesheet-core:latest  # same image as core-service (built once)
    pull_policy: never            # local image only: never try Docker Hub
    # Each worker process loads Docling's models (~1 GB RAM): 2 processes need ~2-3 GB.
    # -B also runs Celery beat inside this container: every 2 minutes it queues the
    # sweeper, which re-queues lost work (queue down at upload time, worker died,
    # scheduled retry lost). So run exactly ONE core-worker container; for more
    # throughput raise WORKER_CONCURRENCY instead. (Several worker containers: move
    # beat back to its own service, or the sweeper runs once per container.)
    command:
      [
        "celery", "-A", "src.control.workers.celery_app", "worker",
        "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}", "-Q", "timesheets",
        "-B", "--schedule=/tmp/celerybeat-schedule",
      ]
    env_file: ./core-service/.env
    environment:
      <<: *core-env
      OTEL_SERVICE_NAME: core-worker
      HF_HOME: /models/hf  # Docling / Hugging Face model cache
    volumes:
      - models:/models  # models download once, survive rebuilds
      - uploads:/data/uploads  # reads the files, deletes them once their text is saved
    depends_on:
      redis:
        condition: service_healthy
      core-service:
        condition: service_healthy  # healthy = core migrations already ran
    restart: unless-stopped

  core-email:
    image: timesheet-core:latest
    pull_policy: never
    command: ["python", "-m", "src.control.workers.email_listener"]
    environment:
      <<: *core-env
      OTEL_SERVICE_NAME: core-email
      EMAIL_ENABLED: "true"
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      EMAIL_START_FROM: new
      IMAP_MARK_AS_READ: ${IMAP_MARK_AS_READ:-false}  # true: mark handled emails as read
    volumes:
      - uploads:/data/uploads  # email attachments wait here for the worker
    depends_on:
      core-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  models:
  uploads: