# Public entry point for the Timesheet Assistant (the only app service published on the host).
#   /              -> built React app (SPA fallback to index.html)
#   /auth/, /users -> auth-service:8001  (path kept: the refresh cookie has Path=/auth)
#   /api/          -> core-service:8002  (the /api prefix is removed)
# Runs as the unprivileged "nginx" user: listens on 8080, pid and temp files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Log the path only: never the query string, cookies or the Authorization header.
    map $request_uri $log_path {
        ~^(?<p>[^?]*) $p;
        default       $request_uri;
    }
    log_format safe '$remote_addr [$time_local] "$request_method $log_path" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout safe;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Docker's DNS. Upstream names are looked up again every 10 s, so nginx starts even if
    # the APIs are down and keeps working when they restart with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        set $auth_upstream http://auth-service:8001;
        set $core_upstream http://core-service:8002;

        include /etc/nginx/security-headers.conf;

        # Shared proxy settings. Set-Cookie passes through untouched (no proxy_cookie_* rewrites).
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # nginx is the edge: do not trust a client-sent header
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # --- auth-service -----------------------------------------------------
        location /auth/ {
            error_page 502 503 504 = @api_down;
            proxy_pass $auth_upstream;
        }
        location = /users {                     # GET /users?role=... has no trailing slash
            error_page 502 503 504 = @api_down;
            proxy_pass $auth_upstream;
        }
        location /users/ {
            client_max_body_size 10m;           # bulk user import (Task 8)
            error_page 502 503 504 = @api_down;
            proxy_pass $auth_upstream;
        }

                # Server-sent events: never buffer, allow a long-lived connection, no gzip.
        location = /api/dashboard/stream {
            error_page 502 503 504 = @api_down;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        # --- core-service: /api/me -> core-service:8002/me ---------------------
        location /api/ {
            client_max_body_size 160m;          # uploads: 10 files x 15 MB, plus overhead
            proxy_request_buffering off;        # stream uploads straight through
            error_page 502 503 504 = @api_down;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $core_upstream;
        }

        # --- JSON (never the React page) when an API is unreachable -------------
        location @api_down {
            include /etc/nginx/security-headers.conf;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"detail":"Service temporarily unavailable","code":"upstream_unavailable"}';
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Hashed build files never change. A missing file is a 404, never index.html.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # SPA fallback: /timesheets/<id> and the other app routes load index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}