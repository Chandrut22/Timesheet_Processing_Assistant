# Alembic config for core-service.
# The database URL is NOT here: env.py reads it from settings (.env / DATABASE_URL).

[alembic]
script_location = %(here)s/src/data/migrations
prepend_sys_path = .
path_separator = os

# Revision file names: 2026_10_13_0930-ab12cd34ef56_create_master_data.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[post_write_hooks]
hooks = ruff_format, ruff
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/Scripts/ruff.exe
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff.type = exec
ruff.executable = %(here)s/.venv/Scripts/ruff.exe
ruff.options = check --fix REVISION_SCRIPT_FILENAME